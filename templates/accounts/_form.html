{% for field in form %}
  <label class="field">
    <span class="field__label">{{ field.label }}</span>
    {{ field }}
    {% for e in field.errors %}<span class="field__error">{{ e }}</span>{% endfor %}
  </label>
{% endfor %}
{% for e in form.non_field_errors %}<div class="msg msg--error">{{ e }}</div>{% endfor %}
