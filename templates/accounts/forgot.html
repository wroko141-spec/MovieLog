{% extends 'base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<section class="auth card">
  <h1>Забыли пароль?</h1>
  <p class="muted">Введите email, и мы отправим ссылку для смены пароля.</p>
  <form method="post" novalidate>{% csrf_token %}
    {% include 'accounts/_form.html' %}
    <button class="btn btn--wide" type="submit">Отправить ссылку</button>
  </form>
  <p class="auth__links"><a href="{% url 'login' %}">Вернуться ко входу</a></p>
</section>
{% endblock %}
