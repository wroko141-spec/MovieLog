{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="auth card">
  <h1>Регистрация</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include 'accounts/_form.html' %}
    <button class="btn btn--wide" type="submit">Создать аккаунт</button>
  </form>
  <p class="auth__links">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</section>
{% endblock %}
